
- name: Create a system user for the application
  ansible.builtin.user:
    name: roboshop
    comment: "roboshop system user"
    shell: /sbin/nologin  # Prevents interactive login
    system: yes               # Creates a system account (usually lower UID) # Creates /home/webapp
    state: present

- name: delete a directory if it does exist
  ansible.builtin.file:
    path: /app 
    state: absent
    
- name: checking component
  ansible.builtin.debug:
    msg: "{{ component }}"

- name: Create a directory if it does not exist
  ansible.builtin.file:
    path: /app 
    state: directory
    
- name: remove {{ component }}.zip if exist
  ansible.builtin.file:
    path: /tmp/{{ component }}.zip
    state: absent

- name: Download {{ component }}.zip
  ansible.builtin.get_url:
    url: https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip
    dest: /tmp/{{ component }}.zip
    
- name: Extract {{ component }}.zip into /var/lib/foo
  ansible.builtin.unarchive:
    src: /tmp/{{ component }}.zip
    dest: /app
    remote_src: yes
    

