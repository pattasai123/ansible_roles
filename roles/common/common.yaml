
- name: Create a system user for the application
  ansible.builtin.user:
    name: roboshop
    comment: "roboshop system user"
    shell: /sbin/nologin  # Prevents interactive login
    system: yes               # Creates a system account (usually lower UID) # Creates /home/webapp
    state: present

- name: Create app directory
  ansible.builtin.file:
    path: /app
    state: directory

- name: Download app content
  ansible.builtin.get_url:
    url: "https://roboshop-artifacts.s3.amazonaws.com/{{ component }}-v3.zip"
    dest: "/tmp/{{ component }}.zip"

- name: Extract app content
  ansible.builtin.unarchive:
    src: "/tmp/{{ component }}.zip"
    dest: /app
    remote_src: yes