- name: copying {{ component }}.service
  ansible.builtin.copy:
    src: "{{ component }}.service.j2"
    dest: /etc/systemd/system/{{ component }}.service
  notify: daemon reload
- name: demon reload
  ansible.builtin.systemd_service:
    name: "{{ component }}"
    enabled: yes
    state: restarted
    daemon_reload: true